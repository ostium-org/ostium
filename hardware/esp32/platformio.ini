; Board build for the door unit (SCRUM-58). The unit tests use the separate
; laptop project in native-tests/. From the repository root:
;
;   pio run -d hardware/esp32                        build the HTTPS build
;   pio run -d hardware/esp32 -e esp32s3-bench       build the bench build
;   pio run -d hardware/esp32 -e esp32s3-bench -t upload -t monitor

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32 @ 6.12.0
; Generic ESP32-S3 board until SCRUM-49 records the exact model.
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson @ ^7.2.0
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall
; test_core defines main() for the native build, so the board skips it.
test_ignore = test_core

; Bench build: also allows a plain-HTTP API root, for FastAPI or the mock on
; a laptop. Never flash it on a door outside the bench.
[env:esp32s3-bench]
extends = env:esp32s3
build_flags = ${env:esp32s3.build_flags} -DOSTIUM_ALLOW_PLAIN_HTTP
