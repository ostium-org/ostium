; Board build for the door unit (SCRUM-58). The unit tests use the separate
; laptop project in native-tests/. From the repository root:
;
;   pio run -d hardware/esp32                        build the HTTPS build
;   pio run -d hardware/esp32 -e esp32s3-bench       build the bench build
;   pio run -d hardware/esp32 -e esp32s3-bench -t upload -t monitor

[platformio]
default_envs = freenove_esp32_s3_wroom

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

[env:freenove_esp32_s3_wroom]
board = freenove_esp32_s3_wroom

; CPU configuration
board_build.f_cpu = 240000000L

; Flash configuration
board_build.flash_mode = qio
board_upload.flash_size = 8MB

; OPI PSRAM configuration
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

; Custom memory partition to avoid exceeding program size limit
board_build.partitions = partitions_8mb.csv 

lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
    arduino-libraries/LiquidCrystal
    adafruit/DHT sensor library
    adafruit/Adafruit Unified sensor

build_unflags = -std=gnu++11

build_flags = 
    -std=gnu++17 
    -Wall 
    -DBOARD_HAS_PSRAM

; test_core defines main() for the native build, so the board skips it.
test_ignore = test_core

; Bench build: also allows a plain-HTTP API root, for the mock on a laptop.
; OSTIUM_BENCH_TOOLS turns on "qr <token>" input on Serial, and lets the door
; trust the test-only QR key. Never flash it on a door outside the bench.
[env:esp32s3-bench]
extends = env:freenove_esp32_s3_wroom

build_flags = 
    ${env:esp32s3.build_flags} 
    -DOSTIUM_ALLOW_PLAIN_HTTP 
    -DOSTIUM_BENCH_TOOLS
