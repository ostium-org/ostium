; Laptop build for the ostium_core unit tests (SCRUM-51). No board needed.
;
; This project is separate from the board's hardware/esp32/platformio.ini, so
; the board setup can change without touching the tests. It builds the shared
; ../lib and ../test folders. From the repository root, run:
;
;   pio test -d hardware/esp32/native-tests
;
; test_core defines main(), so the board environment in
; hardware/esp32/platformio.ini needs test_ignore = test_core.

[platformio]
default_envs = native
lib_dir = ../lib
test_dir = ../test

[env:native]
platform = native
test_framework = unity
lib_deps = bblanchon/ArduinoJson@^7.2.0
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra -Werror
