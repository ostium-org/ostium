# GitHub Actions CI for Ostium (Assignment 1, Part C: SCRUM-46 and SCRUM-53;
# delivery for Assignment 2, Part C).
#
# A push to a pull request starts the build jobs. If every build passes, the
# test jobs run. If every test passes in a pull request that targets main, the
# auto-merge job merges the pull request and starts a run on main, or, if the
# pull request has to wait for something such as a review, leaves the merge to
# a person. When a run on main passes, firmware-release publishes the door
# firmware as a GitHub release. For setup, see docs/ci.md.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# One run per pull request or branch. A newer push cancels the older run, so
# auto-merge never merges a commit that has been replaced.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PLATFORMIO_VERSION: "6.2.0"
  NODE_VERSION: "22"

jobs:
  # Build: the ESP32-S3 firmware, the Supabase Edge Functions, and the Expo app.

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-esp32s3-${{ env.PLATFORMIO_VERSION }}-${{ hashFiles('hardware/esp32/platformio.ini') }}
      - run: pip install "platformio==$PLATFORMIO_VERSION"
      - run: pio run -d hardware/esp32 -e esp32s3
      - run: pio run -d hardware/esp32 -e esp32s3-bench
      # Delivery (Assignment 2, Part C): package both builds on every run, so a
      # packaging problem fails the pull request. firmware-release publishes the
      # package from main. The images hold secrets.example.h's placeholders.
      - run: hardware/esp32/tools/package_firmware.sh dist "r$GITHUB_RUN_NUMBER" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-release
          path: dist/
          if-no-files-found: error

  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      #added this because the Supabase branch replaces the Python service with Edge Functions.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task --config backend/supabase/deno.json check
      - run: deno task --config backend/supabase/deno.json lint

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: application/package-lock.json
      - run: npm ci
      # expo start writes this file, and .gitignore leaves it out. It loads
      # Expo's types, which declare the app's CSS imports.
      - run: printf '/// <reference types="expo/types" />\n' > expo-env.d.ts
      - run: npx tsc --noEmit

  # Test: runs only after every build job passes.

  firmware-test:
    needs: [firmware-build, backend-build, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The QR replay tests use headers generated from the Deno backend. This
      # step fails when they're stale, and prints the command that writes them.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno run --check --allow-read hardware/esp32/tools/capture_qr_backend.ts --check
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-native-${{ env.PLATFORMIO_VERSION }}-${{ hashFiles('hardware/esp32/native-tests/platformio.ini') }}
      - run: pip install "platformio==$PLATFORMIO_VERSION"
      - run: mkdir -p reports
      - run: pio test -d hardware/esp32/native-tests --junit-output-path "$GITHUB_WORKSPACE/reports/firmware-tests.xml"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: firmware-test-report
          path: reports/firmware-tests.xml
          if-no-files-found: ignore

  backend-test:
    needs: [firmware-build, backend-build, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      #did this so backend tests exercise the handlers deployed by this branch.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task --config backend/supabase/deno.json test

  frontend-test:
    needs: [firmware-build, backend-build, frontend-build]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: application/package-lock.json
      - run: npm ci
      - run: npm run test:typecheck
      - run: mkdir -p "$GITHUB_WORKSPACE/reports"
      - run: npm run test -- --reporter=default --reporter=junit --outputFile.junit="$GITHUB_WORKSPACE/reports/frontend-tests.xml"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-test-report
          path: reports/frontend-tests.xml
          if-no-files-found: ignore

  # Merge: runs only after every test job passes, in a pull request into main
  # from a branch of this repository that isn't a draft.

  auto-merge:
    needs: [firmware-test, backend-test, frontend-test]
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == github.event.repository.default_branch &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      # If nothing else blocks the pull request, gh merges it right away, and
      # --match-head-commit makes GitHub refuse if someone pushed again after
      # this run started. If main requires more, such as an approving review,
      # --auto makes gh turn on GitHub's auto-merge instead of failing, and the
      # next step turns it back off.
      - run: gh pr merge "$PR_URL" --merge --auto --match-head-commit "$HEAD_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # GitHub doesn't start a run for a push made with this job's token, but
      # it does for workflow_dispatch. So once the merge is done, start a run
      # on main: it builds and tests the merged code, then firmware-release
      # publishes it. GitHub's auto-merge would merge later on behalf of this
      # job's token, so that merge would start no run on main and publish no
      # release. So if the pull request has to wait, turn auto-merge off and
      # leave the merge to a person: their merge is a push to main, which
      # starts a run there.
      - run: |
          state=$(gh pr view "$PR_URL" --json state --jq .state)
          if [ "$state" != MERGED ]; then
            # This fails if GitHub merged in the meantime; the check below sees that.
            gh pr merge "$PR_URL" --disable-auto || true
            state=$(gh pr view "$PR_URL" --json state --jq .state)
            auto=$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')
          fi
          if [ "$state" = MERGED ]; then
            gh workflow run ci.yml --ref main
          elif [ "$auto" = true ]; then
            echo "::error::Couldn't turn off auto-merge. Turn it off on the pull request, and merge it yourself once the requirement is met: a merge that GitHub makes starts no run on main and publishes no firmware release."
            exit 1
          else
            msg="The pull request has to wait for a requirement, such as an approving review, so this job didn't merge it. Once the requirement is met, merge it yourself: your merge starts a run on main, which publishes the firmware release."
            echo "::warning::$msg"
            echo "$msg" >>"$GITHUB_STEP_SUMMARY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}

  # Delivery (Assignment 2, Part C): when a run on main passes every build and
  # test, publish both firmware builds as a GitHub release tagged at that
  # commit. The run comes from a person's push or merge to main, from
  # auto-merge's workflow_dispatch, or from Run workflow on main. A re-run
  # replaces the assets instead of failing. A release from a re-run of an
  # older run isn't marked Latest, so Latest stays on the newest firmware.
  firmware-release:
    needs: [firmware-test, backend-test, frontend-test]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firmware-release
          path: dist
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: firmware-test-report
          path: dist
      - run: |
          tag="firmware-r$GITHUB_RUN_NUMBER"
          assets=(dist/*.zip dist/SHA256SUMS)
          if [ -f dist/firmware-tests.xml ]; then assets+=(dist/firmware-tests.xml); fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            # GitHub marks a newly published release Latest unless told not to.
            newest=$(gh release list --exclude-drafts --limit 1000 --json tagName \
              --jq '[.[].tagName | select(startswith("firmware-r")) | ltrimstr("firmware-r") | tonumber?] | max // 0')
            latest=true
            if [ "$newest" -gt "$GITHUB_RUN_NUMBER" ]; then latest=false; fi
            gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" --latest="$latest" \
              --title "Door firmware r$GITHUB_RUN_NUMBER" --notes-file dist/release-notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
