# GitHub Actions CI for Ostium (Assignment 1, Part C: SCRUM-46 and SCRUM-53).
#
# A push to a pull request starts the build jobs. If every build passes, the
# test jobs run. If every test passes in a pull request that targets main, the
# auto-merge job merges the pull request. For setup, see docs/ci.md.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# One run per pull request or branch. A newer push cancels the older run, so
# auto-merge never merges a commit that has been replaced.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PLATFORMIO_VERSION: "6.2.0"
  NODE_VERSION: "22"

jobs:
  # Build: the ESP32-S3 firmware, the FastAPI backend, and the Expo app.

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-esp32s3-${{ env.PLATFORMIO_VERSION }}-${{ hashFiles('hardware/esp32/platformio.ini') }}
      - run: pip install "platformio==$PLATFORMIO_VERSION"
      - run: pio run -d hardware/esp32 -e esp32s3
      - run: pio run -d hardware/esp32 -e esp32s3-bench

  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app backend/tests
      - run: python -c "import app.main"
        working-directory: backend

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: application/package-lock.json
      - run: npm ci
      # expo start writes this file, and .gitignore leaves it out. It loads
      # Expo's types, which declare the app's CSS imports.
      - run: printf '/// <reference types="expo/types" />\n' > expo-env.d.ts
      - run: npx tsc --noEmit

  # Test: runs only after every build job passes.

  firmware-test:
    needs: [firmware-build, backend-build, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-native-${{ env.PLATFORMIO_VERSION }}-${{ hashFiles('hardware/esp32/native-tests/platformio.ini') }}
      - run: pip install "platformio==$PLATFORMIO_VERSION"
      - run: mkdir -p reports
      - run: pio test -d hardware/esp32/native-tests --junit-output-path "$GITHUB_WORKSPACE/reports/firmware-tests.xml"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: firmware-test-report
          path: reports/firmware-tests.xml
          if-no-files-found: ignore

  backend-test:
    needs: [firmware-build, backend-build, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: backend

  frontend-test:
    needs: [firmware-build, backend-build, frontend-build]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: application/package-lock.json
      - run: npm ci
      - run: npm run test:typecheck
      - run: mkdir -p "$GITHUB_WORKSPACE/reports"
      - run: npm run test -- --reporter=default --reporter=junit --outputFile.junit="$GITHUB_WORKSPACE/reports/frontend-tests.xml"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-test-report
          path: reports/frontend-tests.xml
          if-no-files-found: ignore

  # Merge: runs only after every test job passes, in a pull request into main
  # from a branch of this repository that isn't a draft.

  auto-merge:
    needs: [firmware-test, backend-test, frontend-test]
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == github.event.repository.default_branch &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # If nothing else blocks the pull request, gh merges it right away, and
      # --match-head-commit makes GitHub refuse if someone pushed again after
      # this run started. If main requires more, such as an approving review,
      # --auto turns on auto-merge, and GitHub merges once the requirement is met.
      - run: gh pr merge "$PR_URL" --merge --auto --match-head-commit "$HEAD_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
